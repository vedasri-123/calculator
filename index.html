<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator Demo</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #4b2aad;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 15px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .add {
            background: #28a745;
        }

        .subtract {
            background: #dc3545;
        }

        .multiply {
            background: #007bff;
        }

        .divide {
            background: #ff9800;
        }

        .increment {
            background: #9c27b0;
        }

        .decrement {
            background: #795548;
        }

        .clear {
            background: #333;
        }

        button:hover {
            opacity: 0.8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #4b2aad;
        }

        .section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }

        .section h3 {
            color: #555;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>🧮 JavaScript Calculator</h1>

    <label>First Number</label>
    <input type="number" id="num1" placeholder="Enter first number">

    <label>Second Number</label>
    <input type="number" id="num2" placeholder="Enter second number">

    <div class="result">
        Result: <span id="result">0</span>
    </div>

    <!-- INTERNAL JAVASCRIPT -->
    <div class="section">
        <h3>Internal JavaScript</h3>

        <div class="buttons">
            <button class="add" onclick="addNumbers()">Add</button>
            <button class="subtract" onclick="subtractNumbers()">Subtract</button>
        </div>
    </div>

    <!-- EXTERNAL JAVASCRIPT -->
    <div class="section">
        <h3>External JavaScript</h3>

        <div class="buttons">
            <button class="multiply" onclick="multiplyNumbers()">Multiply</button>
            <button class="divide" onclick="divideNumbers()">Divide</button>
        </div>
    </div>

    <!-- INLINE JAVASCRIPT -->
    <div class="section">
        <h3>Inline JavaScript</h3>

        <div class="buttons">
            <button class="increment"
                onclick="document.getElementById('result').innerHTML =
                Number(document.getElementById('result').innerHTML) + 1;">
                Increment
            </button>

            <button class="decrement"
                onclick="document.getElementById('result').innerHTML =
                Number(document.getElementById('result').innerHTML) - 1;">
                Decrement
            </button>

            <button class="clear"
                onclick="document.getElementById('num1').value='';
                         document.getElementById('num2').value='';
                         document.getElementById('result').innerHTML='0';">
                Clear
            </button>

            <button class="clear"
                onclick="alert('Hello! Welcome to JavaScript Calculator');">
                Click Here to Say Hi
            </button>
        </div>
    </div>

</div>

<!-- EXTERNAL JAVASCRIPT FILE -->
<script src="script.js"></script>


<!-- INTERNAL JAVASCRIPT -->
<script>

    function getNumbers() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        return [a, b];
    }

    // Internal JavaScript - Addition
    function addNumbers() {

        let numbers = getNumbers();
        let a = numbers[0];
        let b = numbers[1];

        document.getElementById("result").innerHTML = a + b;
    }

    // Internal JavaScript - Subtraction
    function subtractNumbers() {

        let numbers = getNumbers();
        let a = numbers[0];
        let b = numbers[1];

        document.getElementById("result").innerHTML = a - b;
    }

</script>

</body>
</html>
