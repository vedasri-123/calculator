<!DOCTYPE html>
<html>
<head>
    <title>Age Restricted Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-box {
            background-color: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #5b5bea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3333cc;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Form Submission Demo</h1>

        <form onsubmit="checkAge(event)">

            <label>Name:</label>
            <input type="text" id="name" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Age:</label>
            <input type="number" id="age" min="1" max="120" required>

            <button type="submit">Submit</button>

        </form>

        <p id="result"></p>

    </div>

    <script>
        function checkAge(event) {

            event.preventDefault();

            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var age = document.getElementById("age").value;

            var result = document.getElementById("result");

            if (age < 18) {

                result.innerHTML =
                    "❌ Access Denied! You must be 18 or older.";

                result.style.color = "red";

            } else {

                result.innerHTML =
                    "✅ Form Submitted Successfully!<br>" +
                    "Welcome " + name + "!";

                result.style.color = "green";
            }
        }
    </script>

</body>
</html>
