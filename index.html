<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Arithmetic Demo</title>

    <link rel="stylesheet" href="style.css">

    <!-- INTERNAL JAVASCRIPT -->
    <script>
        function addNumbers() {
            let a = Number(document.getElementById("first").value);
            let b = Number(document.getElementById("second").value);

            document.getElementById("result").innerHTML = a + b;
        }

        function subtractNumbers() {
            let a = Number(document.getElementById("first").value);
            let b = Number(document.getElementById("second").value);

            document.getElementById("result").innerHTML = a - b;
        }
    </script>
</head>

<body>

    <div class="container">

        <h1>JavaScript Arithmetic Demo</h1>

        <!-- INPUT SECTION -->
        <div class="input-section">

            <label>First Number</label>
            <input type="number" id="first" placeholder="Enter first number">

            <label>Second Number</label>
            <input type="number" id="second" placeholder="Enter second number">

        </div>

        <!-- RESULT -->
        <div class="result-box">
            <h2>Result: <span id="result">0</span></h2>
        </div>

        <!-- INTERNAL JAVASCRIPT -->
        <div class="section internal">

            <h2>Internal JavaScript</h2>

            <button onclick="addNumbers()">Add</button>

            <button onclick="subtractNumbers()">Subtract</button>

        </div>

        <!-- EXTERNAL JAVASCRIPT -->
        <div class="section external">

            <h2>External JavaScript</h2>

            <button onclick="multiplyNumbers()">Multiply</button>

            <button onclick="divideNumbers()">Divide</button>

        </div>

        <!-- INLINE JAVASCRIPT -->
        <div class="section inline">

            <h2>Inline JavaScript</h2>

            <button onclick="
                document.getElementById('result').innerHTML =
                Number(document.getElementById('result').innerHTML) + 1;
            ">
                Increment
            </button>

            <button onclick="
                document.getElementById('result').innerHTML =
                Number(document.getElementById('result').innerHTML) - 1;
            ">
                Decrement
            </button>

            <button onclick="
                document.getElementById('result').innerHTML = 0;
            ">
                Clear
            </button>

            <button onclick="
                alert('Hi! Welcome to JavaScript Arithmetic Demo!');
            ">
                Click here to say hi
            </button>

        </div>

        <p class="footer">
            HTML • CSS • JavaScript
        </p>

    </div>

    <!-- EXTERNAL JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
